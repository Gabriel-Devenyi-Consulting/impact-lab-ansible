# /etc/tmpfiles.d/xdg-cache.conf — Ansible managed
#
# A separate entry for the parent takes it out of the stock 30d "q /var/tmp"
# cleanup, which would otherwise eventually delete an idle user's directory —
# and with a root-owned parent the user cannot recreate it. Instead only the
# contents of each per-user directory age out after 30 days.
d /var/tmp/xdg-cache   0755 root root -
e /var/tmp/xdg-cache/* -    -    -    30d
