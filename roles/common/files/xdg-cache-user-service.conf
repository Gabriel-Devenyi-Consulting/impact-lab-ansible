# /etc/systemd/system/user@.service.d/50-xdg-cache.conf — Ansible managed
#
# Create the user's local cache directory as root before their systemd manager
# starts. "+" runs it with full privileges despite User=%i; "-" means a failed
# lookup costs the user their cache, not their login.
[Service]
ExecStartPre=-+/usr/local/libexec/xdg-cache-dir %i
