# Run unattended-upgrades shortly before the 03:00 automatic-reboot time
# (60unattended-upgrades-local). unattended-upgrades decides whether users are
# logged in when it runs, then schedules the reboot for Automatic-Reboot-Time.
# With the stock 06:00 schedule, that check would happen ~21 hours before the
# reboot, and anyone who logged in during the day would lose their session.
[Timer]
OnCalendar=
OnCalendar=*-*-* 02:30
RandomizedDelaySec=15m
