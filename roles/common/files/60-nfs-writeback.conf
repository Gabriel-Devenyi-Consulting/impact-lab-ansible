# /etc/sysctl.d/60-nfs-writeback.conf — Ansible managed
#
# Smooth out NFS write bursts. The file server has one 1 Gb/s port shared by
# every workstation. With stock settings a job that writes large files holds
# them in memory and then sends up to 256 MB at once at full link speed, so
# for several seconds everything else on that workstation's NFS mounts waits
# in line behind it, and the server's port is full for other workstations
# too. These values make the kernel send data while it is being written, in
# smaller pieces, instead of in one large burst. Total throughput is unchanged.

# Start background writeback once 64 MB is dirty (stock: 10% of available
# memory, about 10 GB on a 128 GB workstation), so data streams out at the
# pace the program writes it.
vm.dirty_background_bytes = 67108864

# Block a writer once 1 GB is dirty (stock: 20%, about 20 GB). Bounds how much
# unsent data can pile up behind a slow link, and how long sync and shutdown
# take. Local NVMe drains 1 GB in well under a second.
vm.dirty_bytes = 1073741824

# Limit NFS writes in flight to 64 MB per server (stock: 256 MB on these
# hosts). 64 MB is about half a second of a 1 Gb/s link, so other operations
# on the same mount wait at most about that long behind a large write. Needs
# the nfs module, which /etc/modules-load.d/nfs.conf loads before
# systemd-sysctl runs.
fs.nfs.nfs_congestion_kb = 65536
