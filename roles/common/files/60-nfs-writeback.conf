# /etc/sysctl.d/60-nfs-writeback.conf — Ansible managed
#
# Keep a workstation responsive while a job writes large files to NFS. A
# program can write far faster than the 1 Gb/s link to the file server
# carries, and the kernel holds the difference in memory. Every other NFS
# request from this workstation then waits behind that backlog: measured
# freezes of 52 s with stock settings (about 6 GB queued), 13-18 s with a
# 1 GB limit, about 1.3 s with 128 MB and about 0.6 s with 64 MB. Throughput
# to NFS (115 MB/s) and to local NVMe (4.4 GB/s) was the same at every limit.

# Start background writeback once 16 MB is dirty (stock: 10% of available
# memory, about 10 GB on a 128 GB workstation).
vm.dirty_background_bytes = 16777216

# Block a writer once 64 MB is dirty (stock: 20%, about 20 GB). This is the
# setting that bounds the backlog, and so the freeze. It applies to every
# filesystem, not only NFS.
vm.dirty_bytes = 67108864

# Limit NFS writes queued by background writeback to 64 MB per server (stock:
# 256 MB on these hosts). Secondary to vm.dirty_bytes above. Needs the nfs
# module, which /etc/modules-load.d/nfs.conf loads before systemd-sysctl runs.
fs.nfs.nfs_congestion_kb = 65536
