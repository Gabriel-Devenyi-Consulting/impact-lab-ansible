# /etc/systemd/system/user@.service.d/50-scratch.conf — Ansible managed
#
# Create the user's local scratch directory as root before their systemd
# manager starts. "+" runs it with full privileges despite User=%i; "-" means a
# failed lookup costs the user their scratch directory, not their login.
[Service]
ExecStartPre=-+/usr/local/libexec/scratch-dir %i
