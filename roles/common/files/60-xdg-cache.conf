# /etc/environment.d/60-xdg-cache.conf — Ansible managed
#
# Keep per-user caches on the local NVMe instead of the NFS home. Homes are
# krb5p NFS on the file server, which is exported sync and has no SLOG, so every file
# create or timestamp update in ~/.cache is a synchronous ZIL write on spinning
# raidz1 (40-250ms each). Firefox, Mesa/NVIDIA shader caches, thumbnails and
# ksycoca hammer it, and the desktop stalls whenever the NAS is busy.
#
# The directory is created root-owned-parent/0700 by xdg-cache-dir when the
# user's systemd manager starts (user@.service drop-in), and its contents are
# aged out after 30 days (/etc/tmpfiles.d/xdg-cache.conf).
#
# environment.d reaches the whole Plasma session (startplasma, every Plasma
# unit and everything launched from them). /etc/profile.d/xdg.cache.sh sources
# this same file for ssh and console logins, so keep it plain KEY=value lines
# that are valid in both syntaxes.
XDG_CACHE_HOME=/var/tmp/xdg-cache/${USER}
APPTAINER_CACHEDIR=${XDG_CACHE_HOME}/apptainer
CONDA_PKGS_DIRS=${XDG_CACHE_HOME}/conda/pkgs
# uv hardlinks from its cache into venvs; with the cache local and venvs on
# NFS that always fails and uv warns on every install. Copy outright instead.
UV_LINK_MODE=copy
