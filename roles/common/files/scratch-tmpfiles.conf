# /etc/tmpfiles.d/scratch.conf — Ansible managed
#
# /scratch is local disk for job working directories (fMRIPrep -w, FreeSurfer
# SUBJECTS_DIR during a run, temporary files) that would otherwise be written
# to the NFS server. It is not backed up. Contents of each per-user directory
# are deleted once they have not been read or changed for 30 days, so a
# multi-day job is safe but abandoned work directories do not fill the disk.
d /scratch   0755 root root -
e /scratch/* -    -    -    30d
