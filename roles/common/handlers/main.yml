---
- name: Restart smartmontools
  ansible.builtin.service:
    name: smartmontools
    state: restarted

- name: Restart apcupsd
  ansible.builtin.service:
    name: apcupsd
    state: restarted

- name: Restart watchdog
  ansible.builtin.service:
    name: watchdog
    state: restarted

- name: Restart polkit
  ansible.builtin.service:
    name: polkit
    state: restarted

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Restart zram
  ansible.builtin.systemd:
    name: systemd-zram-setup@zram0.service
    state: restarted

- name: Restart swapfile
  ansible.builtin.systemd:
    name: swapfile.swap
    state: restarted
    daemon_reload: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    state: restarted
    daemon_reload: true

- name: Create local cache parent directory
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/xdg-cache.conf
  changed_when: true
