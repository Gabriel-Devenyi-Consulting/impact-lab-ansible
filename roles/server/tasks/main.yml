---
- name: Server | Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  tags: packages

- name: Server | Enable periodic upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  tags: files

- name: Server | Configure unattended-upgrades for servers
  ansible.builtin.copy:
    src: 60unattended-upgrades-local
    dest: /etc/apt/apt.conf.d/60unattended-upgrades-local
    mode: "0644"
  tags: files

# zfsutils-linux ships zfs-scrub-monthly@.timer but enables it for no pool, so
# a pool is never scrubbed unless its timer instance is turned on by name.
- name: Server | Enable the monthly scrub for each ZFS pool
  ansible.builtin.systemd_service:
    name: "zfs-scrub-monthly@{{ item }}.timer"
    enabled: true
    state: started
  loop: "{{ server_zfs_scrub_pools }}"
  tags: zfs

# When one client sends at full link speed, the queue forms in the switch
# port facing this server, which drops other clients' packets along with the
# sender's. Shaping just below link speed moves the queue here, where CAKE
# keeps small flows moving. Off unless an interface is named.
- name: Server | Install the ingress shaping script
  ansible.builtin.copy:
    src: ingress-shape
    dest: /usr/local/sbin/ingress-shape
    mode: "0755"
  when: server_ingress_shape_interface | length > 0
  notify: Restart ingress shaping
  tags: network

- name: Server | Install the ingress shaping service
  ansible.builtin.template:
    src: ingress-shape.service.j2
    dest: /etc/systemd/system/ingress-shape.service
    mode: "0644"
  when: server_ingress_shape_interface | length > 0
  notify: Restart ingress shaping
  tags: network

- name: Server | Enable ingress shaping
  ansible.builtin.systemd_service:
    name: ingress-shape.service
    enabled: true
    state: started
    daemon_reload: true
  when: server_ingress_shape_interface | length > 0
  tags: network
