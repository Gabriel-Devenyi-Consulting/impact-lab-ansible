- name: Workstation | Configure repositories
  ansible.builtin.include_tasks:
    file: repos.yml
    apply:
      tags: packages
  tags: packages

- name: Workstation | Install apt packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: packages
  tags: packages

- name: Workstation | Deploy file configurations
  ansible.builtin.include_tasks:
    file: file-config.yml
    apply:
      tags: files
  tags: files
