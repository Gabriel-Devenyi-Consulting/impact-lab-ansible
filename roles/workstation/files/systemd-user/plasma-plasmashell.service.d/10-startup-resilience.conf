# plasmashell aborts the shell load outright if kactivitymanagerd is not up when
# it checks ("Aborting shell load: The activity manager daemon is not running"),
# and kactivitymanagerd is D-Bus activated, so on a slow login it can lose the
# race by seconds. Order plasmashell after it instead of racing.
#
# The stock 40s timeout and 3-restart limit are also too tight to survive a slow
# login: once the limit is hit plasmashell stays down for the life of the
# session, which is the difference between a slow desktop and a black screen.
[Unit]
Wants=plasma-kactivitymanagerd.service
After=plasma-kactivitymanagerd.service
StartLimitBurst=10
StartLimitIntervalSec=600

[Service]
TimeoutStartSec=180
